[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

; Use Hardware CDC and JTAG mode (default for ESP32-S3)
; This provides:
;   - USB CDC serial port for debugging/MCP commands
;   - USB JTAG routed to GPIO pins for FPGA programming
build_flags = -I include
              -DARDUINO_USB_CDC_ON_BOOT=1
              -DBOARD_HAS_PSRAM

board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = fastled/FastLED@^3.9.4
lib_extra_dirs = libs

; Text mode test environment
[env:text_mode_test]
extends = env:esp32-s3-devkitc-1
; Use pre-build script to copy example into src/__active_example.ino
extra_scripts = pre:examples_select.py
build_src_filter = -<*> +<__active_example.ino> +<*.c> +<*.cpp> +<*.h>
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DEXAMPLE_OVERRIDE

; Space Invaders HDMI demo
[env:spaceinvaders_hdmi]
extends = env:esp32-s3-devkitc-1
extra_scripts = pre:examples_select.py
build_src_filter = -<*> +<__active_example.ino> +<*.c> +<*.cpp> +<*.h>
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DEXAMPLE_OVERRIDE

; FPGA debug monitor example
[env:fpga_debug_monitor]
extends = env:esp32-s3-devkitc-1
extra_scripts = pre:examples_select.py
build_src_filter = -<*> +<__active_example.ino> +<*.c> +<*.cpp> +<*.h>
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DEXAMPLE_OVERRIDE

