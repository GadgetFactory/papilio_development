[env:papilio_arcade]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

build_flags = -I include
              -DARDUINO_USB_CDC_ON_BOOT=1
              -DBOARD_HAS_PSRAM

board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = fastled/FastLED@^3.9.4
lib_extra_dirs = libs
; Clean up any leftover example files before build
extra_scripts = pre:src/utilities/cleanup_examples.py
; Exclude dynamically copied example file from base template build
build_src_filter = +<*> -<__active_example.ino>

; Note: Dual USB CDC requires ESP-IDF component approach which has compatibility
; issues with Arduino-ESP32's pre-built TinyUSB. For now, MCP uses the same
; serial port with protocol framing. See docs for protocol details.
; The environment below is kept for future development when Arduino-ESP32
; adds native support for multiple CDC interfaces.

; [env:papilio_arcade_dual_cdc]
; platform = espressif32
; framework = arduino, espidf
; ... (disabled pending Arduino-ESP32 dual CDC support)

; Text mode test environment
[env:text_mode_test]
extends = env:papilio_arcade
; Use pre-build script to copy example into src/__active_example.ino
extra_scripts = pre:src/utilities/examples_select.py
build_src_filter = +<*> -<papliio_arcade_template.ino>

; Space Invaders HDMI demo
[env:spaceinvaders_hdmi]
extends = env:papilio_arcade
extra_scripts = pre:src/utilities/examples_select.py
build_src_filter = +<*> -<papliio_arcade_template.ino>

; Space Invaders HQVGA demo (160x120 pixel graphics)
[env:spaceinvaders_hqvga]
extends = env:papilio_arcade
extra_scripts = pre:src/utilities/examples_select.py
build_src_filter = +<*> -<papliio_arcade_template.ino>

; Bricks HQVGA demo (160x120 pixel graphics)
[env:bricks_hqvga]
extends = env:papilio_arcade
extra_scripts = pre:src/utilities/examples_select.py
build_src_filter = +<*> -<papliio_arcade_template.ino>

; MCP Debug Firmware - for AI-assisted FPGA debugging
; Source comes from libs/papilio_mcp_server/examples/mcp_debug_simple
[env:mcp_debug_firmware]
extends = env:papilio_arcade
build_flags = ${env:papilio_arcade.build_flags}
              -DPAPILIO_MCP_ENABLED
extra_scripts = pre:src/utilities/examples_select.py
build_src_filter = +<*> -<papliio_arcade_template.ino>

