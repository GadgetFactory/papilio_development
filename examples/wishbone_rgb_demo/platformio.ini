[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor settings
monitor_speed = 115200

; Libraries
lib_deps = 
    papilio_wishbone_bus
    papilio_wb_rgb_led

; Build flags - add library paths
lib_extra_dirs = 
    ../../libs

; Auto-generate top.v before build
extra_scripts = 
    pre:../../libs/papilio_wishbone_bus/tools/generate_top.py
